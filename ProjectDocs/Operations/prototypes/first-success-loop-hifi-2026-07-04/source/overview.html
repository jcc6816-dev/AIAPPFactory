<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overview Map</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="height: auto; overflow: visible;">
  <div class="overview-layout">
    <div class="overview-header">
      <h1>GenForms.ai First Success Loop</h1>
      <p>High-Fidelity Interface Prototype Overview</p>
    </div>
    <div class="overview-grid">
      <div class="overview-card">
        <h3>1. Context Loaded</h3>
        <img src="../01-context-loaded-desktop.png" alt="Context Loaded">
      </div>
      <div class="overview-card">
        <h3>2. Generated Draft</h3>
        <img src="../03-generated-draft-desktop.png" alt="Generated Draft">
      </div>
      <div class="overview-card">
        <h3>3. Publish Success</h3>
        <img src="../05-publish-success-desktop.png" alt="Publish Success">
      </div>
      <div class="overview-card">
        <h3>4. Test Runner</h3>
        <img src="../07-test-runner-desktop.png" alt="Test Runner">
      </div>
      <div class="overview-card">
        <h3>5. First Result</h3>
        <img src="../09-first-result-desktop.png" alt="First Result">
      </div>
      <div class="overview-card">
        <h3>Empty Submissions</h3>
        <img src="../11-empty-submissions-desktop.png" alt="Empty Submissions">
      </div>
    </div>
  </div>
</body>
</html>
